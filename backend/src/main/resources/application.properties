# ================= SERVER =================
server.port=8080

# ================= DATASOURCE =================
spring.datasource.url=jdbc:mysql://localhost:3306/smartqueue?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sairamk8128@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ================= MAIL (SMTP) =================
# Configure with a real SMTP provider (e.g. Gmail App Password) to enable real emails.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
smartqueue.mail.enabled=false
smartqueue.mail.from=noreply@smartqueue.com

# ================= APP SETTINGS =================
smartqueue.token.confirmation-timeout-minutes=2
smartqueue.cors.allowed-origins=http://localhost:5173

# ================= SWAGGER =================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ================= LOGGING =================
logging.level.com.smartqueue=INFO
